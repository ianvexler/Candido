name: Deploy to Production

on:
  release:
    types: [published]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  REF: ${{ github.event.release.tag_name || github.ref_name }}

jobs:
  build:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.REF }}
          fetch-depth: 0

      - name: Require production secrets
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          SECRET_KEY_BASE: ${{ secrets.SECRET_KEY_BASE }}
          CORS_ORIGIN: ${{ secrets.CORS_ORIGIN }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          AWS_BUCKET_NAME: ${{ secrets.AWS_BUCKET_NAME }}
        run: |
          set -euo pipefail
          for var in NEXT_PUBLIC_API_URL SECRET_KEY_BASE CORS_ORIGIN DATABASE_URL AWS_BUCKET_NAME; do
            eval "val=\${$var:-}"
            if [ -z "$val" ]; then
              echo "$var GitHub secret is missing" >&2
              exit 1
            fi
          done
          case "$NEXT_PUBLIC_API_URL" in
            *localhost*|*127.0.0.1*|https://prod_api_url_here)
              echo "NEXT_PUBLIC_API_URL must be the live API origin" >&2
              exit 1
              ;;
          esac
          case "$CORS_ORIGIN" in
            *localhost*|*127.0.0.1*)
              echo "CORS_ORIGIN must be the live site origin" >&2
              exit 1
              ;;
          esac

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push client
        uses: docker/build-push-action@v6
        with:
          context: ./client
          file: ./client/Dockerfile
          push: true
          no-cache: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/candido-client:${{ env.REF }}
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/candido-client:latest
          build-args: |
            NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          no-cache: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/candido-backend:${{ env.REF }}
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/candido-backend:latest

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: read
    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          host_key_checking: false
          command_timeout: 5m
          script: |
            set -euo pipefail

            cd ${{ secrets.EC2_APP_PATH }}

            if ! command -v docker-compose &> /dev/null; then
              sudo curl -L "https://github.com/docker/compose/releases/latest/download/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
              sudo chmod +x /usr/local/bin/docker-compose
            fi

            git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
            REF='${{ env.REF }}'
            git fetch --prune --tags origin

            if git show-ref --verify --quiet "refs/tags/$REF"; then
              git checkout "tags/$REF"
            else
              git checkout "$REF"
              git reset --hard "origin/$REF"
            fi

            mkdir -p backend
            cat > backend/.env << 'ENVEOF'
            RAILS_ENV=production
            PORT=8000
            DATABASE_URL=${{ secrets.DATABASE_URL }}
            SECRET_KEY_BASE=${{ secrets.SECRET_KEY_BASE }}
            CORS_ORIGIN=${{ secrets.CORS_ORIGIN }}
            AWS_BUCKET_NAME=${{ secrets.AWS_BUCKET_NAME }}
            AWS_REGION=${{ secrets.AWS_REGION }}
            AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}
            AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}
            BREVO_SMTP_LOGIN=${{ secrets.BREVO_SMTP_LOGIN }}
            BREVO_SMTP_KEY=${{ secrets.BREVO_SMTP_KEY }}
            GITHUB_REPO_OWNER=${{ github.repository_owner }}
            ENVEOF
            chmod 600 backend/.env

            echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            export IMAGE_TAG="$REF"
            export GITHUB_REPO_OWNER="${{ github.repository_owner }}"

            docker container prune -f || true
            docker image prune -f || true

            docker-compose -f docker-compose.prod.yml --env-file backend/.env pull
            docker-compose -f docker-compose.prod.yml --env-file backend/.env up -d --force-recreate --remove-orphans
