# Express rollback stack. Last candido-server:latest on GHCR is the previous API.
# From the app directory on EC2:
#   docker-compose -f docker-compose.prod.yml --env-file backend/.env down
#   docker-compose -f docker-compose.prod.express.yml --env-file server/.env up -d

services:
  client:
    image: ghcr.io/${GITHUB_REPO_OWNER:-ianvexler}/candido-client:${IMAGE_TAG:-latest}
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
    restart: unless-stopped

  server:
    image: ghcr.io/${GITHUB_REPO_OWNER:-ianvexler}/candido-server:latest
    env_file: server/.env
    ports:
      - "8000:8000"
    environment:
      NODE_ENV: production
    command: sh -c "npx prisma migrate deploy && npm start"
    restart: unless-stopped
