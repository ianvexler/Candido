# Live production stack. Images are built in CI. Do not run db:prepare / db:migrate
# against the Prisma database. Rollback: docker-compose.prod.express.yml

services:
  client:
    image: ghcr.io/${GITHUB_REPO_OWNER:-ianvexler}/candido-client:${IMAGE_TAG:-latest}
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
    restart: unless-stopped

  backend:
    image: ghcr.io/${GITHUB_REPO_OWNER:-ianvexler}/candido-backend:${IMAGE_TAG:-latest}
    env_file: backend/.env
    ports:
      - "8000:8000"
    environment:
      RAILS_ENV: production
      PORT: 8000
    restart: unless-stopped
