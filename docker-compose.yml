version: '3.8'
services:
  db:
    image: postgres:14
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: candido
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      target: dev
    ports:
      - "3000:3000"
    volumes:
      - ./client:/app
      - /app/node_modules
      - /app/.next
    command: sh -c "npm install && npm run dev"
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      - backend

  server:
    profiles: ["node"]
    build:
      context: ./server
      dockerfile: Dockerfile
      args:
        DATABASE_URL: postgresql://postgres:password@db:5432/candido
    ports:
      - "8002:5000"
    environment:
      NODE_ENV: development
      PORT: 5000
      DATABASE_URL: postgresql://postgres:password@db:5432/candido
    volumes:
      - ./server:/app
    command: sh -c "npm install && npx prisma generate && npm run dev"
    depends_on:
      db:
        condition: service_healthy

  prisma-studio:
    profiles: ["node"]
    build:
      context: ./server
      dockerfile: Dockerfile
      args:
        DATABASE_URL: postgresql://postgres:password@db:5432/candido
    ports:
      - "5555:5555"
    environment:
      DATABASE_URL: postgresql://postgres:password@db:5432/candido
    command: npx prisma studio --browser none --port 5555
    depends_on:
      db:
        condition: service_healthy

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    ports:
      - "8000:3000"
    volumes:
      - ./backend:/app
      - backend_bundle:/usr/local/bundle
    command: bash -c "rm -f tmp/pids/server.pid && bundle install && bin/rails server -b 0.0.0.0 -p 3000"
    environment:
      RAILS_ENV: development
      DATABASE_URL: postgresql://postgres:password@db:5432/candido
      CORS_ORIGIN: http://localhost:3000
    depends_on:
      db:
        condition: service_healthy
networks:
  default:
    driver: bridge
volumes:
  pgdata:
  backend_bundle: